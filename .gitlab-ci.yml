stages: [quality, screenshots, build, release]

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

quality:
  stage: quality
  tags: [linux]
  script:
    - bash scripts/quality_gate.sh

screenshots:
  stage: screenshots
  tags: [linux]
  script:
    - uv sync --group dev
    - QT_QPA_PLATFORM=offscreen uv run python scripts/capture_docs_screenshots.py
  artifacts:
    name: "djmidi-studio-documentation-screenshots-$CI_COMMIT_TAG"
    paths:
      - docs/images/layout/*.png
    expire_in: 30 days

.build_template:
  stage: build
  script:
    - bash scripts/build.sh --skip-python-package
    - bash scripts/release_artifacts.sh --os "$TARGET_OS" --allow-unsigned
  artifacts:
    name: "djmidi-studio-$TARGET_OS-$CI_COMMIT_TAG"
    paths:
      - dist/release/
    expire_in: 30 days

build:linux:
  extends: .build_template
  tags: [linux]
  variables: { TARGET_OS: linux }

build:macos:
  extends: .build_template
  tags: [macos]
  variables: { TARGET_OS: macos }

build:windows:
  extends: .build_template
  tags: [windows]
  variables: { TARGET_OS: windows }

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [build:linux, build:macos, build:windows, screenshots]
  artifacts:
    name: "djmidi-studio-$CI_COMMIT_TAG-all-os"
    paths:
      - dist/release/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - glab release create "$CI_COMMIT_TAG" --name "DJ MIDI Studio $CI_COMMIT_TAG" --notes "Release $CI_COMMIT_TAG." --assets-link "{\"url\":\"$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download\",\"name\":\"All OS artifacts\"}"
