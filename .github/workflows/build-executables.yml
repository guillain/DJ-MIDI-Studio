name: Build Executables

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux MIDI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run quality gate
        shell: bash
        run: bash scripts/quality_gate.sh

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux MIDI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        shell: bash
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh --skip-python-package

      - name: Build package artifacts
        run: uv build

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: djmidi-studio-${{ matrix.os }}-executable
          path: dist/executables/

      - name: Upload wheel and sdist
        uses: actions/upload-artifact@v4
        with:
          name: djmidi-studio-${{ matrix.os }}-python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
