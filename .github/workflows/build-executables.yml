name: Build Executables

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux GUI and MIDI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run quality gate
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/quality_gate.sh

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux GUI and MIDI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        shell: bash
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh --skip-python-package

      - name: Smoke test executable startup
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
        run: uv run python scripts/smoke_test_executable.py --os "$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]' | sed 's/macos/macos/; s/windows/windows/; s/linux/linux/')"

      - name: Build package artifacts
        run: uv build

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: djmidi-studio-${{ matrix.os }}-executable
          path: dist/executables/

      - name: Upload wheel and sdist
        uses: actions/upload-artifact@v7
        with:
          name: djmidi-studio-${{ matrix.os }}-python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  create-pull-request:
    name: Create Pull Request after successful CI
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout branch history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create Pull Request when missing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          open_prs="$(gh pr list --base main --head "$BRANCH_NAME" --state open --json number --jq 'length')"
          if [[ "$open_prs" -gt 0 ]]; then
            echo "An open Pull Request already exists for $BRANCH_NAME."
            exit 0
          fi
          commits="$(git log --format='- %s' origin/main..HEAD)"
          body="## Automated CI result

          The multi-platform CI pipeline completed successfully on Linux, macOS, and Windows.

          ### Included commits

          $commits

          ### Checks

          - Quality gate passed.
          - Native executable builds passed for all supported OS runners.
          - Python package artifacts were built successfully.

          Please review and merge this Pull Request when ready."
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Integrate $BRANCH_NAME" \
            --body "$body"
