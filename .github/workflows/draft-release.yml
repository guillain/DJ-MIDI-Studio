name: Draft Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to build and publish (for example v1.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "Tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux GUI and MIDI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run quality gate
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/quality_gate.sh

  screenshots:
    name: Documentation screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux GUI and MIDI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Generate screenshots from the reference mapping
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/capture_docs_screenshots.py

      - name: Upload documentation screenshots
        uses: actions/upload-artifact@v7
        with:
          name: djmidi-studio-documentation-screenshots
          path: docs/images/layout/*.png

  build:
    name: Build (${{ matrix.os }})
    needs: [quality, screenshots]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        shell: bash
        run: |
          chmod +x scripts/build.sh scripts/release_artifacts.sh
          scripts/build.sh --skip-python-package

      - name: Build wheel + sdist
        run: uv build

      - name: Create executable archive
        shell: bash
        run: |
          # A Developer ID identity is not available on the public runner.
          # Keep the first release publishable while clearly documenting the
          # resulting Gatekeeper warning in the release documentation.
          scripts/release_artifacts.sh --allow-unsigned

      - name: Upload executable archive
        uses: actions/upload-artifact@v7
        with:
          name: djmidi-studio-${{ matrix.os }}-executable
          path: dist/release/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: djmidi-studio-${{ matrix.os }}-python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  draft:
    name: Create Draft Release
    needs: [build, screenshots]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Show downloaded files
        shell: bash
        run: |
          find release-assets -type f | sort

      - name: Create draft release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
            release-assets/**/*.whl
            release-assets/**/*.png
