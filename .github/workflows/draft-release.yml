name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run quality gate
        shell: bash
        run: bash scripts/quality_gate.sh

  screenshots:
    name: Documentation screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Generate screenshots from the reference mapping
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/capture_docs_screenshots.py

      - name: Upload documentation screenshots
        uses: actions/upload-artifact@v4
        with:
          name: djmidi-studio-documentation-screenshots
          path: docs/images/layout/*.png

  build:
    name: Build (${{ matrix.os }})
    needs: [quality, screenshots]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        shell: bash
        run: |
          chmod +x scripts/build.sh scripts/release_artifacts.sh
          scripts/build.sh --skip-python-package

      - name: Build wheel + sdist
        run: uv build

      - name: Create executable archive
        shell: bash
        run: |
          scripts/release_artifacts.sh

      - name: Upload executable archive
        uses: actions/upload-artifact@v4
        with:
          name: djmidi-studio-${{ matrix.os }}-executable
          path: dist/release/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: djmidi-studio-${{ matrix.os }}-python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  draft:
    name: Create Draft Release
    needs: [build, screenshots]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show downloaded files
        shell: bash
        run: |
          find release-assets -type f | sort

      - name: Create draft release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
            release-assets/**/*.whl
            release-assets/**/*.png
