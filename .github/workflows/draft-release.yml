name: Draft Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to build and publish (for example v0.44.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "Tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux GUI and MIDI build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install_linux_gui_deps.sh

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run quality gate
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/quality_gate.sh

  screenshots:
    name: Documentation screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux GUI and MIDI build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install_linux_gui_deps.sh

      - name: Install dependencies
        run: uv sync --group dev

      - name: Generate screenshots from the reference mapping
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/capture_docs_screenshots.py

      - name: Upload documentation screenshots
        uses: actions/upload-artifact@v7
        with:
          name: djmidi-studio-documentation-screenshots
          path: docs/images/layout/*.png

  build:
    name: Build (${{ matrix.os }})
    needs: [quality, screenshots]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux GUI and MIDI build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install_linux_gui_deps.sh

      - name: Install dependencies
        run: uv sync --group dev

      # macOS signing/notarization (issue #262, docs/developer/cicd/macos-signing.md).
      # Every secret below is optional: with none configured, each step prints
      # "skipping" and the release ships the unsigned app exactly as before.
      # Secrets reach the scripts through env only, never through `if:` or the
      # command line, so they can't leak into logs.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: bash scripts/macos_signing.sh import-certificate

      - name: Build executable
        shell: bash
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          chmod +x scripts/build.sh scripts/release_artifacts.sh scripts/macos_signing.sh
          scripts/build.sh --skip-python-package

      - name: Smoke test executable startup
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}
        run: uv run python scripts/smoke_test_executable.py --os "$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]' | sed 's/macos/macos/; s/windows/windows/; s/linux/linux/')"

      - name: Build wheel + sdist
        run: uv build

      - name: Create executable archive
        shell: bash
        run: |
          # With a Developer ID identity imported above, refuse to package an
          # app whose signature doesn't verify. Without one (no Apple secrets
          # configured), keep the release publishable as an unsigned build,
          # with the Gatekeeper warning documented for users.
          if [[ "${{ runner.os }}" == "macOS" && -n "${MACOS_SIGNING_IDENTITY:-}" ]]; then
            scripts/release_artifacts.sh
          else
            scripts/release_artifacts.sh --allow-unsigned
          fi

      - name: Delete temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: bash scripts/macos_signing.sh cleanup

      - name: Upload executable archive
        uses: actions/upload-artifact@v7
        with:
          name: djmidi-studio-${{ matrix.os }}-executable
          path: dist/release/*

      - name: Upload package artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: djmidi-studio-${{ matrix.os }}-python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  draft:
    name: Create Draft Release
    needs: [build, screenshots]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Show downloaded files
        shell: bash
        run: |
          find release-assets -type f | sort

      - name: Generate SHA-256 checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          checksum_file="release-assets/DJ-MIDI-Studio-${RELEASE_TAG}-SHA256SUMS.txt"
          (
            cd release-assets
            find . -type f \( \
              -name '*.zip' -o \
              -name '*.tar.gz' -o \
              -name '*.whl' \
            \) -print0 | sort -z | xargs -0 sha256sum
          ) > "$checksum_file"
          cat "$checksum_file"

      - name: Create or update GitHub release with artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            find release-assets -type f \( \
              -name '*.zip' -o \
              -name '*.tar.gz' -o \
              -name '*.whl' -o \
              -name '*SHA256SUMS.txt' \
            \) -print | sort
          )
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refreshing its assets."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "DJ MIDI Studio $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
