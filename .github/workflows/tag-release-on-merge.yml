name: Tag Release After Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag merged release
    # Every merged PR into main releases the version it brings: the tag
    # `vX.Y.Z-<branch slug>` is created on the merge commit and the release is
    # built from it. A merge that keeps an already released version (docs only,
    # no bump) has nothing new to release and stops here.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read and validate project version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          existing="$(git tag -l "v$VERSION" "v$VERSION-*" | head -n 1)"
          if [[ -n "$existing" ]]; then
            echo "Version $VERSION is already released as $existing; nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slug="$(printf '%s' "${HEAD_REF##*/}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          tag="v$VERSION${slug:+-$slug}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag $tag created on the merge commit."
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  build-and-publish:
    name: Build and publish release assets
    needs: tag-release
    if: needs.tag-release.outputs.tag != ''
    uses: ./.github/workflows/draft-release.yml
    with:
      tag_name: ${{ needs.tag-release.outputs.tag }}
    # The optional macOS signing/notarization secrets (issue #262); a reusable
    # workflow sees none of the caller's secrets unless they are passed on.
    secrets: inherit
    permissions:
      contents: write
