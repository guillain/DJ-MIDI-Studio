[project]
name = "djmidi"
version = "0.47.11"
description = "DJ MIDI mapping visualizer, editor, and controller toolkit"
authors = [
    { name = "guillain", email = "guillain@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.7",
    "aalink>=0.2.3",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "radon>=6.0",
    "ruff>=0.6",
]

[project.scripts]
djmidi = "djmidi:main"
djmidi-send-midi = "djmidi.midi_send:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
