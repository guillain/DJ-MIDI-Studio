[project]
name = "seratomidiconf"
version = "0.1.0"
description = "Visualizer and editor for Serato DJ Pro MIDI configuration files"
authors = [
    { name = "guillain", email = "guillain@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.7",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "radon>=6.0",
    "ruff>=0.6",
]

[project.scripts]
seratomidiconf = "seratomidiconf:main"
seratomidiconf-send-midi = "seratomidiconf.midi_send:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
